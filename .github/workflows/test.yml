name: tests
on:
  push:
  pull_request:
jobs:
  macos:
    # macOS minutes of private repositories cost 10x; public ones are free
    if: ${{ !github.event.repository.private }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install rclone ripgrep jq
      - name: tests (Homebrew python)
        run: tests/run.sh
      - name: tests (system python 3.9)
        run: SESSYNC_PYTHON=/usr/bin/python3 tests/run.sh
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: sudo apt-get update && sudo apt-get install -y rclone ripgrep jq
      - name: tests (system python)
        run: SESSYNC_PYTHON=/usr/bin/python3 tests/run.sh
      - name: tests (python 3.9)
        run: SESSYNC_PYTHON="$(command -v python3.9)" tests/run.sh
